version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: alfaaz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AlfaazStudio
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/temp/alfaaz_studio.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MODEL_DIR=/app/models
      - OUTPUT_DIR=/app/outputs
      - TEMP_DIR=/app/temp
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: alfaaz-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: alfaaz-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      - APP_NAME=AlfaazStudio-Worker
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/temp/alfaaz_studio.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MODEL_DIR=/app/models
      - OUTPUT_DIR=/app/outputs
      - TEMP_DIR=/app/temp
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: alfaaz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

